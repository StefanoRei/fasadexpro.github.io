{% assign lang = page.lang | default: "ru" %}
{% assign i18n = site.data.i18n %}
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ i18n.sections.about_title[lang] }}</title>
<link rel="stylesheet" href="{{ '/css/main.css' | relative_url }}" />
<style>
    /* Уменьшаем высоту навигационной панели */
    header {
        padding: 15px 15px;
        height: auto;
    }

    .header-logo img {
        height: 80px;
    }

    /* Увеличиваем отступ от навигации до контента */
    main {
        padding-top: 15px;
    }

    /* Стили для кнопки вакансий */
    .vacancies-section {
        padding: 40px 0;
        text-align: center;
    }

    .vacancy-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        position: relative;
        padding: 18px 40px;
        background-color: #2c3e50;
        color: white;
        text-decoration: none;
        font-family: 'Arial', sans-serif;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.5px;
        border-radius: 50px;
        overflow: hidden;
        transition: all 0.4s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        max-width: 280px;
    }

    .vacancy-btn:hover {
        transform: scale(1.05);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        background-color: #34495e;
    }

    .vacancy-btn span {
        transition: transform 0.4s ease;
    }

    .vacancy-btn .arrow {
        margin-left: 12px;
        transition: transform 0.4s ease;
        transform: translateX(0);
    }

        {
        % if lang=='ar' %
    }

    .vacancy-btn .arrow {
        margin-left: 0;
        margin-right: 12px;
        transform: scaleX(-1);
    }

        {
        % endif %
    }

    .vacancy-btn:hover .arrow {
        transform: translateX(5px);
    }

        {
        % if lang=='ar' %
    }

    .vacancy-btn:hover .arrow {
        transform: translateX(-5px) scaleX(-1);
    }

        {
        % endif %
    }

    /* Новые стили для текста между заголовком и проектами */
    .projects-intro {
        text-align: center;
        max-width: 800px;
        margin: 30px auto 40px;
        padding: 0 20px;
        font-size: 18px;
        line-height: 1.6;
        color: #333;
    }

    /* Увеличиваем отступ для заголовка Проекты */
    #pro .title {
        margin-top: 30px;
    }
</style>
